site_name: LLMegeton
site_description: Field guide to existing LLM models and tips for directing your digital daemons
site_url: https://semicolonexpected.github.io/LLMegeton/
repo_url: https://github.com/SemicolonExpected/LLMegeton
repo_name: SemicolonExpected/LLMegeton
edit_uri: edit/main/docs/

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - material/tags
  - include-markdown

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - AI Overview:
    - Main: About-AI/index.md
    - Myths: About-AI/myths.md
    - Tokenomics: About-AI/tokenomics.md
    - Capabilities: capabilities/index.md
    - Skills: skills/index.md
    - Prompting Guide: prompting-guide/index.md
    - Recurring Tasks: recurring-tasks/index.md
  - Models:
    - Models: models/index.md
    - Claude:
      - Claude: models/claude/Sonnet-5.5/index.md
      - Claude Code: models/claude/Claude-Code/index.md
      - Claude Science: models/claude/claude-tips/index.md
      - Bug Zoo: models/claude/bug-zoo/index.md
      - System Prompts: models/claude/prompts/index.md
    - Muse: 
      - Muse Spark 1.3: models/muse/index.md
      - Bug Zoo: models/muse/bug-zoo/index.md
    - Luna:
      - ChatGPT Luna: models/luna/index.md
      - Architecture: models/luna/architecture/index.md
      - Bug Zoo: models/luna/bug-zoo/index.md
    - Notion AI:
      - Notion AI: models/notion-ai/index.md
      - Bug Zoo: models/notion-ai/bug-zoo/index.md
  - About: 
    - SemicolonExpected: docs/whoami.md
    - Daimon: models/daimon/index.md

hooks:
  - hooks.py
