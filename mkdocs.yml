site_name: LLMegeton
site_description: Field guide to existing LLM models and tips for directing your digital daemons
site_url: https://semicolonexpected.github.io/LLMegeton/
repo_url: https://github.com/SemicolonExpected/LLMegeton
repo_name: SemicolonExpected/LLMegeton
edit_uri: edit/main/docs/

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - material/tags
  - include-markdown

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Capabilities: capabilities/index.md
  - Prompting Guide: prompting-guide/index.md
  - Recurring Tasks: recurring-tasks/index.md
  - Models:
    - Models: models/index.md
    - Claude:
      - Claude Tips: models/claude/claude-tips/index.md
      - Bug Zoo: models/claude/bug-zoo/index.md
      - Style Guide: models/claude/bug-zoo/style-guide/index.md
    - Muse: 
      - Muse Spark 1.3: models/muse/index.md
      - Bug Zoo: models/muse/bug-zoo/index.md
    - Daimon: models/daimon/index.md
    - Luna: models/luna/index.md
    - Notion AI: models/notion-ai/index.md
  - Skills: skills/index.md
